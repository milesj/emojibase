[package]
name = "emojibase-generator"
description = "Build-time generator for emojibase emoji datasets. Fetches Unicode and CLDR data, normalizes it, and produces JSON datasets, regex patterns, and shortcode mappings."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "emojibase-generator"
path = "src/main.rs"

[dependencies]
emojibase-core = { path = "../emojibase-core" }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
scraper = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"
rayon = "1"
indicatif = "0.17"
flate2 = "1"
any_ascii = "0.3"
