[workspace]
members = ["crates/emojibase-core", "crates/emojibase-generator"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/milesj/emojibase"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
